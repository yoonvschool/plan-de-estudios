<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Malla Académica - Majo</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

#topbar{
    padding:15px;
    background:#1a1a1a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
}

#contenedor{
    display:flex;
    overflow-x:auto;
    padding:20px;
    gap:20px;
}

.ciclo{
    min-width:250px;
}

.ciclo h2{
    text-align:center;
    margin-bottom:10px;
}

.curso{
    background:#444;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    transition:0.2s;
}

.curso:hover{
    transform:scale(1.03);
}

.aprobado{
    background:#00c853 !important;
}

.disponible{
    background:#d50000 !important;
}

button{
    background:#d50000;
    border:none;
    padding:6px 12px;
    color:white;
    border-radius:4px;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}
</style>
</head>
<body>

<div id="topbar">
    <div id="progreso">Progreso: 0%</div>
    <button onclick="resetear()">Resetear</button>
</div>

<div id="contenedor"></div>

<script>

// =====================
// CURSOS COMPLETOS
// =====================

const cursos = {

"CBO104 Cálculo I": { ciclo:1, prereq:[] },
"CBO105 Matemática Básica": { ciclo:1, prereq:[] },
"CBO106 Biología": { ciclo:1, prereq:[] },
"CBO101 Lenguaje": { ciclo:1, prereq:[] },
"CBO102 Métodos Estudio": { ciclo:1, prereq:[] },
"CBO103 Gestión Personal": { ciclo:1, prereq:[] },

"CBO206 Física I": { ciclo:2, prereq:[] },
"CBO204 Cálculo II": { ciclo:2, prereq:["CBO104 Cálculo I"] },
"183032 Elementos Álgebra": { ciclo:2, prereq:["CBO105 Matemática Básica"] },
"183033 Algorítmica": { ciclo:2, prereq:["CBO105 Matemática Básica"] },
"183034 Matemática Discreta": { ciclo:2, prereq:["CBO105 Matemática Básica"] },

"183031 Cálculo III": { ciclo:3, prereq:["CBO204 Cálculo II"] },
"183044 Estructura de Datos": { ciclo:3, prereq:["183033 Algorítmica"] },

"183041 Cálculo IV": { ciclo:4, prereq:["183031 Cálculo III"] },
"183051 Análisis Real": { ciclo:4, prereq:["183031 Cálculo III"] },
"183042 Álgebra": { ciclo:4, prereq:["183032 Elementos Álgebra"] },
"183062 Probabilidad": { ciclo:4, prereq:["183032 Elementos Álgebra"] },

"183061 Análisis Funcional I": { ciclo:5, prereq:["183051 Análisis Real"] },
"183052 EDO": { ciclo:5, prereq:["CBO204 Cálculo II","183032 Elementos Álgebra"] },
"183053 Base de Datos": { ciclo:5, prereq:["183044 Estructura de Datos"] },

"183071 Análisis Funcional II": { ciclo:6, prereq:["183061 Análisis Funcional I"] },
"183081 EDP I": { ciclo:6, prereq:["183052 EDO"] },
"183064 Sistemas Operativos": { ciclo:6, prereq:["183053 Base de Datos"] },

"183074 Inteligencia Artificial": { ciclo:7, prereq:["183064 Sistemas Operativos"] },
"183083 Redes": { ciclo:7, prereq:["183064 Sistemas Operativos"] },
"183065 Técnicas Modelamiento": { ciclo:7, prereq:["183043 Modelos Física"] },

"183111 EDP II": { ciclo:8, prereq:["183081 EDP I","183071 Análisis Funcional II"] }

};

// =====================
// ESTADO
// =====================

let aprobados = new Set(JSON.parse(localStorage.getItem("aprobados")) || []);

// =====================
// RENDER
// =====================

function puedeLlevar(nombre){
    return cursos[nombre].prereq.every(pr => aprobados.has(pr));
}

function render(){

    const contenedor = document.getElementById("contenedor");
    contenedor.innerHTML="";

    let ciclos = {};

    Object.entries(cursos).forEach(([nombre,data])=>{
        if(!ciclos[data.ciclo]) ciclos[data.ciclo]=[];
        ciclos[data.ciclo].push(nombre);
    });

    Object.keys(ciclos).sort((a,b)=>a-b).forEach(ciclo=>{
        let col = document.createElement("div");
        col.className="ciclo";
        col.innerHTML=`<h2>Ciclo ${ciclo}</h2>`;

        ciclos[ciclo].forEach(nombre=>{
            let div = document.createElement("div");
            div.className="curso";
            div.innerText=nombre;

            if(aprobados.has(nombre)){
                div.classList.add("aprobado");
            }else if(puedeLlevar(nombre)){
                div.classList.add("disponible");
            }

            div.onclick=()=>{
                if(puedeLlevar(nombre)){
                    if(aprobados.has(nombre)) aprobados.delete(nombre);
                    else aprobados.add(nombre);

                    localStorage.setItem("aprobados",JSON.stringify([...aprobados]));
                    render();
                }
            };

            col.appendChild(div);
        });

        contenedor.appendChild(col);
    });

    actualizarProgreso();
}

function actualizarProgreso(){
    let total=Object.keys(cursos).length;
    let porcentaje=Math.round((aprobados.size/total)*100);
    document.getElementById("progreso").innerText=
        `Progreso: ${porcentaje}% (${aprobados.size}/${total})`;
}

function resetear(){
    aprobados.clear();
    localStorage.removeItem("aprobados");
    render();
}

render();

</script>

</body>
</html>
