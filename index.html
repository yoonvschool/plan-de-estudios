<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Malla Curricular</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>

<style>
body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background:#0f172a;
  color:white;
  overflow:hidden;
}

header{
  padding:20px;
  text-align:center;
  background:#0b1220;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

h1{
  margin:0;
  font-weight:600;
}

#progress-wrapper{
  width:60%;
  margin:15px auto 5px auto;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
}

#progress-bar{
  height:14px;
  width:0%;
  background:#00aaff;
  transition:0.4s;
}

#progress-text{
  font-size:13px;
  color:#94a3b8;
  margin-bottom:5px;
}

#graph-container{
  width:100%;
  height:80vh;
  overflow-x:auto;
  overflow-y:hidden;
}

#cy{
  width:3500px;
  height:100%;
}
</style>
</head>
<body>

<header>
  <h1>Malla Curricular</h1>
  <div id="progress-wrapper">
    <div id="progress-bar"></div>
  </div>
  <div id="progress-text">0% completado</div>
</header>

<div id="graph-container">
  <div id="cy"></div>
</div>

<script>

// ==========================
// PEGA AQUÍ TU LISTA COMPLETA
// ==========================

const cursos = {

  // CICLO 0
"183111": {nombre:"EDP II", ciclo:0, prereq:["183081","183071"]},
"183112": {nombre:"Análisis Complejo Aplicado", ciclo:0, prereq:["183051"]},
"183113": {nombre:"Ecuaciones Integrales", ciclo:0, prereq:["183081"]},
"183114": {nombre:"Análisis Complejo CN", ciclo:0, prereq:["183112"]},
"183115": {nombre:"Problemas Inversos", ciclo:0, prereq:["1803052"]},

// CICLO 1
"CBE003": {nombre:"Economía General", ciclo:1, prereq:[]},
"CBE004": {nombre:"Género y Sociedad", ciclo:1, prereq:[]},
"CBO101": {nombre:"Lenguaje", ciclo:1, prereq:[]},
"CBO102": {nombre:"Métodos de Estudio", ciclo:1, prereq:[]},
"CBO103": {nombre:"Gestión Personal", ciclo:1, prereq:[]},
"CBO104": {nombre:"Cálculo I", ciclo:1, prereq:[]},
"CBO105": {nombre:"Matemática Básica", ciclo:1, prereq:[]},
"CBO106": {nombre:"Biología", ciclo:1, prereq:[]},

// CICLO 2
"CBO201": {nombre:"Fund. Investigación", ciclo:2, prereq:[]},
"CBO202": {nombre:"Medio Ambiente", ciclo:2, prereq:["CBO106"]},
"CBO203": {nombre:"Realidad Nacional", ciclo:2, prereq:[]},
"CBO204": {nombre:"Cálculo II", ciclo:2, prereq:["CBO104"]},
"CBO205": {nombre:"Química", ciclo:2, prereq:[]},
"CBO206": {nombre:"Física General", ciclo:2, prereq:[]},

// CICLO 3
"183031": {nombre:"Cálculo III", ciclo:3, prereq:["CBO204"]},
"183032": {nombre:"Álgebra y Geometría", ciclo:3, prereq:["CBO105","CBO104"]},
"183033": {nombre:"Algorítmica", ciclo:3, prereq:["CBO105"]},
"183034": {nombre:"Mat. Discreta", ciclo:3, prereq:["CBO105","CBO104"]},
"183035": {nombre:"Inglés I", ciclo:3, prereq:[]},

// CICLO 4
"183041": {nombre:"Cálculo IV", ciclo:4, prereq:["183031"]},
"183042": {nombre:"Álgebra", ciclo:4, prereq:["183032"]},
"183043": {nombre:"Modelos Física", ciclo:4, prereq:["CBO204","CBO105","CBO206"]},
"183044": {nombre:"Estructura de Datos", ciclo:4, prereq:["183033"]},
"183045": {nombre:"Inglés II", ciclo:4, prereq:["183035"]},

// CICLO 5
"183051": {nombre:"Análisis Real", ciclo:5, prereq:["183031"]},
"1803052": {nombre:"EDO", ciclo:5, prereq:["CBO204","183032"]},
"183053": {nombre:"Base de Datos", ciclo:5, prereq:["183044"]},
"183054": {nombre:"Métodos Numéricos I", ciclo:5, prereq:["CBO204","183042"]},
"183055": {nombre:"Inglés III", ciclo:5, prereq:["183045"]},

// CICLO 6
"183061": {nombre:"Análisis Funcional I", ciclo:6, prereq:["183051","183042"]},
"183062": {nombre:"Probabilidad", ciclo:6, prereq:["CBO204","183032"]},
"183063": {nombre:"Métodos Numéricos II", ciclo:6, prereq:["183054","1803052"]},
"183064": {nombre:"Sistemas Operativos", ciclo:6, prereq:["183053"]},
"183065": {nombre:"Modelamiento", ciclo:6, prereq:["183043"]},

// CICLO 7
"183071": {nombre:"Análisis Funcional II", ciclo:7, prereq:["183061","1803052"]},
"183072": {nombre:"Computación Gráfica", ciclo:7, prereq:["183042"]},
"183073": {nombre:"Modelos I", ciclo:7, prereq:["1803052","183065"]},
"183074": {nombre:"IA", ciclo:7, prereq:["183064"]},

// CICLO 8
"183081": {nombre:"EDP I", ciclo:8, prereq:["1803052"]},
"183082": {nombre:"Modelos II", ciclo:8, prereq:["183073"]},
"183083": {nombre:"Redes", ciclo:8, prereq:["183064"]},
"183084": {nombre:"Proyecto Investigación", ciclo:8, prereq:[]},

// CICLO 9
"183091": {nombre:"Optimización", ciclo:9, prereq:["183051","183042"]},
"183092": {nombre:"Modelos III", ciclo:9, prereq:["183082"]},
"183093": {nombre:"Métodos Numéricos III", ciclo:9, prereq:["183063","183081"]},
"183094": {nombre:"Desarrollo Proyecto", ciclo:9, prereq:[]},

// CICLO 10
"183101": {nombre:"Modelos IV", ciclo:10, prereq:["183092"]},
"183102": {nombre:"Gestión Proyectos", ciclo:10, prereq:["183083"]},
"183103": {nombre:"Práctica", ciclo:10, prereq:[]},
"183104": {nombre:"Sustentación", ciclo:10, prereq:["183094"]},

};

// ==========================
// POSICIÓN FIJA POR CICLO
// ==========================

function cicloPos(c){
  return c === 0 ? 11 : c;
}

const spacingX = 260;
const spacingY = 120;
let contador = {};
let elementos = [];

Object.keys(cursos).forEach(id=>{
  const curso = cursos[id];
  const col = cicloPos(curso.ciclo);

  if(!contador[col]) contador[col]=0;

  elementos.push({
    data:{ id:id, label:curso.nombre },
    position:{
      x: col * spacingX,
      y: 120 + contador[col]*spacingY
    }
  });

  contador[col]++;

  curso.prereq.forEach(p=>{
    elementos.push({
      data:{ id:p+"-"+id, source:p, target:id }
    });
  });
});

// ==========================
// CYTOSCAPE
// ==========================

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elementos,
  layout:{ name:'preset' },
  style:[
    {
      selector:'node',
      style:{
        'label':'data(label)',
        'text-wrap':'wrap',
        'text-max-width':160,
        'text-valign':'center',
        'text-halign':'center',
        'font-size':11,
        'background-color':'#1e293b',
        'border-color':'#334155',
        'border-width':1,
        'color':'#64748b',
        'shape':'roundrectangle',
        'width':200,
        'height':70
      }
    },
    {
      selector:'edge',
      style:{
        'curve-style':'bezier',
        'target-arrow-shape':'triangle',
        'line-color':'#334155',
        'target-arrow-color':'#334155',
        'width':1,
        'opacity':0   // ocultas por defecto
      }
    }
  ],
  userZoomingEnabled:true,
  userPanningEnabled:true,
  wheelSensitivity:0.2
});

// ==========================
// TÍTULOS DE CICLO
// ==========================

for(let i=1;i<=11;i++){
  const nombre = (i===11) ? "Ciclo 0" : "Ciclo "+i;

  cy.add({
    group:'nodes',
    data:{ id:'titulo'+i, label:nombre },
    position:{ x:i*spacingX, y:40 },
    selectable:false,
    grabbable:false,
    style:{
      'background-opacity':0,
      'border-width':0,
      'color':'#00aaff',
      'font-size':18,
      'font-weight':'600'
    }
  });
}

// ==========================
// LÓGICA ACADÉMICA
// ==========================

let aprobados = new Set();

function actualizar(){

  let total = Object.keys(cursos).length;
  let completados = aprobados.size;
  let porcentaje = total===0?0:Math.round((completados/total)*100);

  document.getElementById("progress-bar").style.width = porcentaje+"%";
  document.getElementById("progress-text").innerText =
    porcentaje+"% completado ("+completados+"/"+total+")";

  cy.nodes().forEach(n=>{

    if(n.id().startsWith("titulo")) return;

    const id = n.id();
    const prereq = cursos[id].prereq;

    if(aprobados.has(id)){
      n.style({
        'background-color':'#064e3b',
        'border-color':'#00ffcc',
        'color':'#ffffff'
      });
    }
    else if(prereq.every(r=>aprobados.has(r))){
      n.style({
        'background-color':'#0c4a6e',
        'border-color':'#00aaff',
        'color':'#ffffff'
      });
    }
    else{
      n.style({
        'background-color':'#1e293b',
        'border-color':'#334155',
        'color':'#64748b'
      });
    }

  });

  cy.edges().style('opacity',0);
}

cy.on('tap','node',evt=>{

  const id = evt.target.id();
  if(id.startsWith("titulo")) return;

  // alternar aprobado
  if(aprobados.has(id)){
    aprobados.delete(id);
  } else {
    aprobados.add(id);
  }

  actualizar();

  // iluminar SOLO relaciones del nodo clickeado
  cy.edges().forEach(e=>{
    if(e.source().id()===id || e.target().id()===id){
      e.style({
        'opacity':1,
        'line-color':'#00aaff',
        'target-arrow-color':'#00aaff',
        'width':2
      });
    }
  });

});

actualizar();

</script>

</body>
</html>
