<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Malla Interactiva</title>

<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial, sans-serif;
  color:white;
  overflow:hidden;
}

#cy{
  width:100vw;
  height:85vh;
  display:block;
}

#progress-container{
  width:90%;
  margin:15px auto;
  background:#1e293b;
  border-radius:8px;
  overflow:hidden;
}

#progress-bar{
  height:18px;
  width:0%;
  background:#00ffaa;
  transition:0.3s;
}

#progress-text, #time-remaining{
  text-align:center;
  margin-top:5px;
  font-size:14px;
}
</style>
</head>

<body>

<div id="progress-container">
  <div id="progress-bar"></div>
</div>
<div id="progress-text"></div>
<div id="time-remaining"></div>

<div id="cy"></div>

<script>

// ===============================
// CONFIGURA TUS CURSOS AQUÍ
// ===============================

const cursos = {

  // CICLO 0
"183111": {nombre:"EDP II", ciclo:0, prereq:["183081","183071"]},
"183112": {nombre:"Análisis Complejo Aplicado", ciclo:0, prereq:["183051"]},
"183113": {nombre:"Ecuaciones Integrales", ciclo:0, prereq:["183081"]},
"183114": {nombre:"Análisis Complejo CN", ciclo:0, prereq:["183112"]},
"183115": {nombre:"Problemas Inversos", ciclo:0, prereq:["1803052"]},

// CICLO 1
"CBE003": {nombre:"Economía General", ciclo:1, prereq:[]},
"CBE004": {nombre:"Género y Sociedad", ciclo:1, prereq:[]},
"CBO101": {nombre:"Lenguaje", ciclo:1, prereq:[]},
"CBO102": {nombre:"Métodos de Estudio", ciclo:1, prereq:[]},
"CBO103": {nombre:"Gestión Personal", ciclo:1, prereq:[]},
"CBO104": {nombre:"Cálculo I", ciclo:1, prereq:[]},
"CBO105": {nombre:"Matemática Básica", ciclo:1, prereq:[]},
"CBO106": {nombre:"Biología", ciclo:1, prereq:[]},

// CICLO 2
"CBO201": {nombre:"Fund. Investigación", ciclo:2, prereq:[]},
"CBO202": {nombre:"Medio Ambiente", ciclo:2, prereq:["CBO106"]},
"CBO203": {nombre:"Realidad Nacional", ciclo:2, prereq:[]},
"CBO204": {nombre:"Cálculo II", ciclo:2, prereq:["CBO104"]},
"CBO205": {nombre:"Química", ciclo:2, prereq:[]},
"CBO206": {nombre:"Física General", ciclo:2, prereq:[]},

// CICLO 3
"183031": {nombre:"Cálculo III", ciclo:3, prereq:["CBO204"]},
"183032": {nombre:"Álgebra y Geometría", ciclo:3, prereq:["CBO105","CBO104"]},
"183033": {nombre:"Algorítmica", ciclo:3, prereq:["CBO105"]},
"183034": {nombre:"Mat. Discreta", ciclo:3, prereq:["CBO105","CBO104"]},
"183035": {nombre:"Inglés I", ciclo:3, prereq:[]},

// CICLO 4
"183041": {nombre:"Cálculo IV", ciclo:4, prereq:["183031"]},
"183042": {nombre:"Álgebra", ciclo:4, prereq:["183032"]},
"183043": {nombre:"Modelos Física", ciclo:4, prereq:["CBO204","CBO105","CBO206"]},
"183044": {nombre:"Estructura de Datos", ciclo:4, prereq:["183033"]},
"183045": {nombre:"Inglés II", ciclo:4, prereq:["183035"]},

// CICLO 5
"183051": {nombre:"Análisis Real", ciclo:5, prereq:["183031"]},
"1803052": {nombre:"EDO", ciclo:5, prereq:["CBO204","183032"]},
"183053": {nombre:"Base de Datos", ciclo:5, prereq:["183044"]},
"183054": {nombre:"Métodos Numéricos I", ciclo:5, prereq:["CBO204","183042"]},
"183055": {nombre:"Inglés III", ciclo:5, prereq:["183045"]},

// CICLO 6
"183061": {nombre:"Análisis Funcional I", ciclo:6, prereq:["183051","183042"]},
"183062": {nombre:"Probabilidad", ciclo:6, prereq:["CBO204","183032"]},
"183063": {nombre:"Métodos Numéricos II", ciclo:6, prereq:["183054","1803052"]},
"183064": {nombre:"Sistemas Operativos", ciclo:6, prereq:["183053"]},
"183065": {nombre:"Modelamiento", ciclo:6, prereq:["183043"]},

// CICLO 7
"183071": {nombre:"Análisis Funcional II", ciclo:7, prereq:["183061","1803052"]},
"183072": {nombre:"Computación Gráfica", ciclo:7, prereq:["183042"]},
"183073": {nombre:"Modelos I", ciclo:7, prereq:["1803052","183065"]},
"183074": {nombre:"IA", ciclo:7, prereq:["183064"]},

// CICLO 8
"183081": {nombre:"EDP I", ciclo:8, prereq:["1803052"]},
"183082": {nombre:"Modelos II", ciclo:8, prereq:["183073"]},
"183083": {nombre:"Redes", ciclo:8, prereq:["183064"]},
"183084": {nombre:"Proyecto Investigación", ciclo:8, prereq:[]},

// CICLO 9
"183091": {nombre:"Optimización", ciclo:9, prereq:["183051","183042"]},
"183092": {nombre:"Modelos III", ciclo:9, prereq:["183082"]},
"183093": {nombre:"Métodos Numéricos III", ciclo:9, prereq:["183063","183081"]},
"183094": {nombre:"Desarrollo Proyecto", ciclo:9, prereq:[]},

// CICLO 10
"183101": {nombre:"Modelos IV", ciclo:10, prereq:["183092"]},
"183102": {nombre:"Gestión Proyectos", ciclo:10, prereq:["183083"]},
"183103": {nombre:"Práctica", ciclo:10, prereq:[]},
"183104": {nombre:"Sustentación", ciclo:10, prereq:["183094"]},

  // agrega tus ciclos reales aquí
};

let aprobados = new Set();

// ===============================
// GENERAR POSICIONES POR CICLO
// ===============================

let elements = [];

const separacionX = 240;
const separacionY = 120;
const inicioX = 200;
const inicioY = 180;

let contadorPorCiclo = {};
let ciclosDetectados = new Set();

Object.keys(cursos).forEach(id=>{

  const ciclo = cursos[id].ciclo;
  ciclosDetectados.add(ciclo);

  if(!contadorPorCiclo[ciclo]){
    contadorPorCiclo[ciclo] = 0;
  }

  const posX = inicioX + (ciclo-1) * separacionX;
  const posY = inicioY + contadorPorCiclo[ciclo] * separacionY;

  contadorPorCiclo[ciclo]++;

  elements.push({
    data:{ id:id, label:cursos[id].nombre },
    position:{ x:posX, y:posY }
  });

  cursos[id].prereq.forEach(p=>{
    elements.push({
      data:{ source:p, target:id }
    });
  });

});

// ===============================
// TÍTULOS DE CICLO
// ===============================

ciclosDetectados.forEach(ciclo=>{

  if(ciclo === 0) return;

  const posX = inicioX + (ciclo-1) * separacionX;

  elements.push({
    data:{ id:"titulo_"+ciclo, label:"CICLO " + ciclo },
    position:{ x:posX, y:100 },
    selectable:false,
    grabbable:false
  });

});

// ===============================
// CREAR CYTOSCAPE
// ===============================

const cy = cytoscape({
  container: document.getElementById('cy'),

  autoungrabify: true,   // no mover nodos
  autolock: true,

  zoomingEnabled: true,
  userZoomingEnabled: true,

  panningEnabled: true,
  userPanningEnabled: true,   // ← puedes mover el fondo

  minZoom: 0.6,
  maxZoom: 3,

  layout:{ name:"preset" },

  style:[
    {
      selector:'node',
      style:{
        'background-color':'#1e293b',
        'label':'data(label)',
        'color':'#94a3b8',
        'text-valign':'center',
        'text-halign':'center',
        'width':150,
        'height':55,
        'font-size':10,
        'border-width':2,
        'border-color':'#334155',
        'shape':'roundrectangle'
      }
    },
    {
      selector:'node[id^="titulo_"]',
      style:{
        'background-color':'transparent',
        'border-width':0,
        'font-size':18,
        'color':'#00ffaa',
        'width':160,
        'height':30
      }
    },
    {
      selector:'edge',
      style:{
        'width':2,
        'line-color':'#334155',
        'target-arrow-color':'#334155',
        'target-arrow-shape':'triangle',
        'curve-style':'bezier'
      }
    }
  ],

  elements:elements
});

// Centrado inicial SIN bloquear movimiento después
cy.ready(function(){
  cy.fit(undefined, 150);
  cy.center();
});

// ===============================
// CLICK PARA APROBAR
// ===============================

cy.on('tap','node', function(evt){

  const id = evt.target.id();
  if(id.startsWith("titulo_")) return;

  if(aprobados.has(id)){
    aprobados.delete(id);
  } else {
    aprobados.add(id);
  }

  actualizar();
});

// ===============================
// FUNCIÓN ACTUALIZAR
// ===============================

function actualizar(){

  let totalCursos = Object.keys(cursos).length;
  let completados = aprobados.size;

  let porcentaje = totalCursos===0 ? 0 :
    (completados / totalCursos);

  document.getElementById("progress-bar").style.width =
    Math.round(porcentaje*100) + "%";

  document.getElementById("progress-text").innerText =
    Math.round(porcentaje*100) + "% completado (" +
    completados + "/" + totalCursos + ")";

  // ===============================
  // CÁLCULO REAL DE AÑOS
  // ===============================

  const ciclosTotales = 10;  // ajusta si tu carrera tiene más
  const añosTotales = ciclosTotales / 2;

  let ciclosEquivalentes = porcentaje * ciclosTotales;
  let añosAvanzados = ciclosEquivalentes / 2;
  let añosRestantes = añosTotales - añosAvanzados;

  if(añosRestantes < 0) añosRestantes = 0;

  document.getElementById("time-remaining").innerText =
    "Te faltan aproximadamente " +
    añosRestantes.toFixed(1) +
    " año(s) para terminar.";

  // ===============================
  // COLORES
  // ===============================

  cy.nodes().forEach(n=>{

    const id = n.id();
    if(id.startsWith("titulo_")) return;

    const prereq = cursos[id].prereq;

    if(aprobados.has(id)){
      n.style({
        'background-color':'#064e3b',
        'border-color':'#00ffcc',
        'color':'#ffffff'
      });
    }
    else if(prereq.every(r=>aprobados.has(r))){
      n.style({
        'background-color':'#0c4a6e',
        'border-color':'#00aaff',
        'color':'#ffffff'
      });
    }
    else{
      n.style({
        'background-color':'#1e293b',
        'border-color':'#334155',
        'color':'#94a3b8'
      });
    }

  });

}

</script>
</body>
</html>
