<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Malla Interactiva - Computación Científica</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

<style>
body {
  margin: 0;
  background: #080812;
  font-family: Arial, sans-serif;
}

#cy {
  width: 100vw;
  height: 100vh;
}

.panel {
  position: fixed;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.85);
  padding: 15px;
  border-radius: 12px;
  color: white;
  font-size: 14px;
}

button {
  margin-top: 8px;
  background: #111;
  border: 1px solid #555;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #222;
}
</style>
</head>
<body>

<div id="cy"></div>

<div class="panel">
<b>Estados</b><br>
<span style="color:#00ff88;">■ Aprobado</span><br>
<span style="color:#00aaff;">■ Disponible</span><br>
<span style="color:#555;">■ Bloqueado</span><br>
<button onclick="resetear()">Resetear</button>
</div>

<script>

// =============================
// CURSOS COMPLETOS
// =============================

const cursos = {

// CICLO 1
"CBE003": {nombre:"Economía General", ciclo:1, prereq:[]},
"CBE004": {nombre:"Género y Sociedad", ciclo:1, prereq:[]},
"CBO101": {nombre:"Lenguaje", ciclo:1, prereq:[]},
"CBO102": {nombre:"Métodos de Estudio Universitario", ciclo:1, prereq:[]},
"CBO103": {nombre:"Gestión Personal", ciclo:1, prereq:[]},
"CBO104": {nombre:"Cálculo I", ciclo:1, prereq:[]},
"CBO105": {nombre:"Matemática Básica", ciclo:1, prereq:[]},
"CBO106": {nombre:"Biología", ciclo:1, prereq:[]},

// CICLO 2
"CBO201": {nombre:"Fundamentos de Investigación Científica", ciclo:2, prereq:[]},
"CBO202": {nombre:"Medio Ambiente y Desarrollo Sostenible", ciclo:2, prereq:["CBO106"]},
"CBO203": {nombre:"Realidad Nacional y Mundial", ciclo:2, prereq:[]},
"CBO204": {nombre:"Cálculo II", ciclo:2, prereq:["CBO104"]},
"CBO205": {nombre:"Química Inorgánica y Orgánica", ciclo:2, prereq:[]},
"CBO206": {nombre:"Física General", ciclo:2, prereq:[]},

// CICLO 3
"183031": {nombre:"Cálculo III", ciclo:3, prereq:["CBO204"]},
"183032": {nombre:"Elementos de Álgebra y Geometría", ciclo:3, prereq:["CBO105","CBO104"]},
"183033": {nombre:"Algorítmica y Fundamentos de Programación", ciclo:3, prereq:["CBO105"]},
"183034": {nombre:"Matemática Discreta y Computacional", ciclo:3, prereq:["CBO105","CBO104"]},
"183035": {nombre:"Inglés I", ciclo:3, prereq:[]},

// CICLO 4
"183041": {nombre:"Cálculo IV", ciclo:4, prereq:["183031"]},
"183042": {nombre:"Álgebra", ciclo:4, prereq:["183032"]},
"183043": {nombre:"Modelos Matemáticos de la Física", ciclo:4, prereq:["CBO204","CBO105","CBO206"]},
"183044": {nombre:"Estructura de Datos", ciclo:4, prereq:["183033"]},
"183045": {nombre:"Inglés II", ciclo:4, prereq:["183035"]},

// CICLO 5
"183051": {nombre:"Análisis Real", ciclo:5, prereq:["183031"]},
"1803052": {nombre:"Ecuaciones Diferenciales Ordinarias", ciclo:5, prereq:["CBO204","183032"]},
"183053": {nombre:"Base de Datos e Ingeniería de Software", ciclo:5, prereq:["183044"]},
"183054": {nombre:"Métodos Numéricos y Programación I", ciclo:5, prereq:["CBO204","183042"]},
"183055": {nombre:"Inglés III", ciclo:5, prereq:["183045"]},

// CICLO 6
"183061": {nombre:"Análisis Funcional I", ciclo:6, prereq:["183051","183042"]},
"183062": {nombre:"Probabilidad e Inferencia Estadística", ciclo:6, prereq:["CBO204","183032"]},
"183063": {nombre:"Métodos Numéricos y Programación II", ciclo:6, prereq:["183054","1803052"]},
"183064": {nombre:"Sistemas Operativos", ciclo:6, prereq:["183053"]},
"183065": {nombre:"Técnicas de Modelamiento", ciclo:6, prereq:["183043"]},

// CICLO 7
"183071": {nombre:"Análisis Funcional II", ciclo:7, prereq:["183061","1803052"]},
"183072": {nombre:"Computación Gráfica", ciclo:7, prereq:["183042"]},
"183073": {nombre:"Modelos Matemáticos de la Ciencia I", ciclo:7, prereq:["1803052","183065"]},
"183074": {nombre:"Inteligencia Artificial", ciclo:7, prereq:["183064"]},

// CICLO 8
"183081": {nombre:"Ecuaciones Diferenciales Parciales I", ciclo:8, prereq:["1803052"]},
"183082": {nombre:"Modelos Matemáticos de la Ciencia II", ciclo:8, prereq:["183073"]},
"183083": {nombre:"Redes, Arquitectura y Comunicaciones", ciclo:8, prereq:["183064"]},
"183084": {nombre:"Proyecto de Investigación", ciclo:8, prereq:[]},

// CICLO 9
"183091": {nombre:"Optimización", ciclo:9, prereq:["183051","183042"]},
"183092": {nombre:"Modelos Matemáticos de la Ciencia III", ciclo:9, prereq:["183082"]},
"183093": {nombre:"Métodos Numéricos y Programación III", ciclo:9, prereq:["183063","183081"]},
"183094": {nombre:"Desarrollo del Proyecto de Investigación", ciclo:9, prereq:[]},

// CICLO 10
"183101": {nombre:"Modelos Matemáticos de la Ciencia IV", ciclo:10, prereq:["183092"]},
"183102": {nombre:"Formulación, Evaluación y Gestión de Proyectos", ciclo:10, prereq:["183083"]},
"183103": {nombre:"Práctica Pre Profesional", ciclo:10, prereq:[]},
"183104": {nombre:"Presentación y Sustentación del Proyecto", ciclo:10, prereq:["183094"]},

// CICLO 0
"183111": {nombre:"Ecuaciones Diferenciales Parciales II", ciclo:0, prereq:["183081","183071"]},
"183112": {nombre:"Análisis Complejo y Aplicado", ciclo:0, prereq:["183051"]},
"183113": {nombre:"Ecuaciones Integrales", ciclo:0, prereq:["183081"]},
"183114": {nombre:"Análisis Complejo en CN", ciclo:0, prereq:["183112"]},
"183115": {nombre:"Problemas Inversos", ciclo:0, prereq:["1803052"]}

};

// =============================
// GRAFO
// =============================

let aprobados = new Set(JSON.parse(localStorage.getItem("aprobados") || "[]"));
const elements = [];
const spacingX = 260;
const spacingY = 100;
const contador = {};

Object.entries(cursos).forEach(([id,data]) => {
  if(!contador[data.ciclo]) contador[data.ciclo] = 0;

  elements.push({
    data:{id:id,label:data.nombre},
    position:{
      x:(data.ciclo+1)*spacingX,
      y:contador[data.ciclo]*spacingY+50
    }
  });

  contador[data.ciclo]++;

  data.prereq.forEach(p=>{
    elements.push({data:{source:p,target:id}});
  });
});

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elements,
  layout:{name:'preset'},
  style:[
    {selector:'node',style:{
      'background-color':'#444',
      'label':'data(label)',
      'color':'white',
      'text-wrap':'wrap',
      'text-max-width':150,
      'width':170,
      'height':55,
      'shape':'roundrectangle',
      'font-size':9
    }},
    {selector:'edge',style:{
      'width':2,
      'line-color':'#555',
      'target-arrow-color':'#555',
      'target-arrow-shape':'triangle'
    }}
  ]
});

function actualizar(){
  cy.nodes().forEach(n=>{
    const id=n.id();
    const req=cursos[id].prereq;

    if(aprobados.has(id)){
      n.style('background-color','#00ff88');
      n.style('box-shadow','0 0 25px #00ff88');
    }
    else if(req.every(r=>aprobados.has(r))){
      n.style('background-color','#00aaff');
      n.style('box-shadow','0 0 25px #00aaff');
    }
    else{
      n.style('background-color','#444');
      n.style('box-shadow','none');
    }
  });
  localStorage.setItem("aprobados",JSON.stringify([...aprobados]));
}

cy.on('tap','node',evt=>{
  const id=evt.target.id();
  if(aprobados.has(id)) aprobados.delete(id);
  else aprobados.add(id);
  actualizar();
});

function resetear(){
  aprobados.clear();
  actualizar();
}

actualizar();

</script>
</body>
</html>
